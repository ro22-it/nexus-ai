spring.application.name=nexus-server
server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/nexus;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
nexus.ai.provider=${NEXUS_PROVIDER:demo}
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-6.2-astra}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
