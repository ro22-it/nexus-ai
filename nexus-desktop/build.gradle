plugins {
    id 'application'
    id 'org.openjfx.javafxplugin'
}

application {
    mainClass = 'ai.nexus.desktop.NexusDesktopApplication'
}

javafx {
    version = '21.0.6'
    modules = ['javafx.controls', 'javafx.graphics']
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
}
